# Dark Knight: one hue, carried by light.
#
# Generated by src/palette.py from backgrounds/0-batman-dark-knight-portrait.jpg.
# Do not hand-edit: change the script, or change the wallpaper and re-run it.
#
# Quantised to sixteen buckets, that image is monochromatic. Measured:
#   hue          203 degrees, weighted over every sample with real saturation
#   saturation   falls 0.38 points per point of lightness
#                (about 34% at black, 10% at the highlight)
#   warm pixels  0.07% of the image
#
# So every structural colour below is that one hue, with the image's own
# saturation for its lightness. Hierarchy is carried by lightness alone,
# which is how the photograph is built. Nothing is imported.
#
# The accent is the same hue with saturation turned up to 52%, the one
# axis the photograph leaves unused: it never exceeds 32%, so the accent
# reads as deliberate while remaining the same colour as everything else.
#
# Gold is not the accent any more. It is the warning colour, and it gets
# roughly the share of the screen it has in the picture. A warm hue is
# doing its job when it is foreign to everything around it; that is what
# a warning is, and it is not what a window frame is.

mode = "dark"

# Ground, from the image's shadows down.
background               = "#0A1014"  # contrast  1.00:1 on the base
dark_background          = "#070B0D"  # contrast  1.03:1 on the base
darker_background        = "#040708"  # contrast  1.06:1 on the base
lighter_background       = "#162128"  # contrast  1.17:1 on the base

# Structure and text, up the same ramp. Body text needs 4.5:1, UI 3:1.
line                     = "#283943"  # contrast  1.60:1 on the base
muted                    = "#607786"  # contrast  4.08:1 on the base
dark_foreground          = "#84949E"  # contrast  6.12:1 on the base
light_foreground         = "#A1AAB0"  # contrast  8.11:1 on the base
foreground               = "#CCCFD1"  # contrast 12.23:1 on the base
bright_foreground        = "#ECEDEE"  # contrast 16.33:1 on the base
cursor                   = "#CCCFD1"  # contrast 12.23:1 on the base

# The accent, and what it paints.
accent                   = "#6CB0D0"  # contrast  7.98:1 on the base
accent_dim               = "#3C7C9A"  # contrast  4.14:1 on the base
selection                = "#1D2D35"  # contrast  1.35:1 on the base
selection_background     = "#1D2D35"  # contrast  1.35:1 on the base
selection_foreground     = "#ECEDEE"  # contrast 16.33:1 on the base

# Window borders.
hyprland_active_border   = "rgba(6CB0D0ee) rgba(3C7C9Aee) 45deg"
hyprland_inactive_border = "rgba(283943cc)"

# Semantic and ANSI. Gold is the warning.
red                      = "#B57069"  # contrast  5.00:1 on the base
yellow                   = "#BFAB69"  # contrast  8.43:1 on the base
orange                   = "#BD976B"  # contrast  7.11:1 on the base
green                    = "#85AD92"  # contrast  7.65:1 on the base
cyan                     = "#74B4B2"  # contrast  8.12:1 on the base
blue                     = "#749BB4"  # contrast  6.46:1 on the base
magenta                  = "#A58BB1"  # contrast  6.31:1 on the base
brown                    = "#7C6550"  # contrast  3.49:1 on the base

# Bright variants.
bright_red               = "#CF958F"  # contrast  7.61:1 on the base
bright_yellow            = "#D1C394"  # contrast 10.89:1 on the base
bright_green             = "#B0CFBA"  # contrast 11.38:1 on the base
bright_cyan              = "#A9D1CF"  # contrast 11.58:1 on the base
bright_blue              = "#A1BDCE"  # contrast  9.74:1 on the base
bright_magenta           = "#C4B0CF"  # contrast  9.53:1 on the base

# The 16 slots, for anything reading them directly.
color0  = "#0A1014"
color1  = "#B57069"
color2  = "#85AD92"
color3  = "#BFAB69"
color4  = "#749BB4"
color5  = "#A58BB1"
color6  = "#74B4B2"
color7  = "#CCCFD1"
color8  = "#283943"
color9  = "#CF958F"
