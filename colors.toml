# Dark Knight: one hue, carried by light.
#
# Generated by src/palette.py from a recorded photograph (see MEASURED in src/palette.py).
# Do not hand-edit: change the script, or change the wallpaper and re-run it.
#
# Quantised to sixteen buckets, that image is monochromatic. Measured:
#   hue          203 degrees, weighted over every sample with real saturation
#   saturation   falls 0.38 points per point of lightness
#                (about 34% at black, 10% at the highlight)
#   warm pixels  0.07% of the image
#
# So every structural colour below is that one hue, with the image's own
# saturation for its lightness. Hierarchy is carried by lightness alone,
# which is how the photograph is built. Nothing is imported.
#
#   peak chroma  13.1, the most colourful thing in the image
#
# The accent is the image's own hue, measured in Lab because that is where
# it is placed. Steel, the fills, sits at chroma 11 or under: inside the
# photograph's own range. The accent is marked by lightness first, with
# only the chroma (19) it takes to stand off the text ramp, and the
# active window border is that colour again, darker than body text.
#
# A monochrome photograph has no red and no green and a terminal needs
# them anyway, so the image sets the envelope rather than the hue. It
# fixes how colourful anything may be (chroma 23 for the ANSI set)
# while their lightness is fixed; the hues are then positions on the
# wheel, spaced far enough apart that the audit's distance floors pass.
# There is no gold and no imported accent.

mode = "dark"

# Ground, from the image's shadows down.
background               = "#0A1014"
dark_background          = "#070B0D"
darker_background        = "#040708"
lighter_background       = "#162128"

# Structure and text, up the same ramp. Body text needs 4.5:1, UI 3:1.
line                     = "#283943"
muted                    = "#687F8D"
dark_foreground          = "#86969F"
light_foreground         = "#A1AAB0"
foreground               = "#CCCFD1"
bright_foreground        = "#ECEDEE"
cursor                   = "#CCCFD1"

# The accent, and what it paints.
accent                   = "#99C1DC"
accent_dim               = "#596D7B"
active_border            = "#739BB5"
selection                = "#222E36"
selection_background     = "#222E36"
selection_foreground     = "#ECEDEE"

# Window borders.
hyprland_active_border   = "rgba(739BB5ee)"
hyprland_inactive_border = "rgba(283943cc)"

# Semantic and ANSI. Yellow is the warning.
red                      = "#BF878C"
yellow                   = "#A1966D"
orange                   = "#B88D75"
green                    = "#7B9F7E"
cyan                     = "#5BA1A3"
blue                     = "#7F97BE"
magenta                  = "#B389A7"
brown                    = "#755845"

# Bright variants.
bright_red               = "#E9AEB3"
bright_yellow            = "#C9BC92"
bright_green             = "#A1C6A4"
bright_cyan              = "#82C9CA"
bright_blue              = "#A4BDE5"
bright_magenta           = "#DAAFCE"

# The 16 slots, for anything reading them directly.
color0  = "#0A1014"
color1  = "#BF878C"
color2  = "#7B9F7E"
color3  = "#A1966D"
color4  = "#7F97BE"
color5  = "#B389A7"
color6  = "#5BA1A3"
color7  = "#CCCFD1"
color8  = "#687F8D"
color9  = "#E9AEB3"
color10 = "#A1C6A4"
color11 = "#C9BC92"
color12 = "#A4BDE5"
color13 = "#DAAFCE"
color14 = "#82C9CA"
color15 = "#ECEDEE"
