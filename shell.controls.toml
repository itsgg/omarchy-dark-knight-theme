# Generated by src/controls.py from colors.toml. Do not hand-edit.
[controls]
# Idle control chrome.
normal-color        = "#CCCFD1"
normal-fill-alpha   = 0.04
normal-border       = "#CCCFD1"
normal-border-width = 1
normal-border-alpha = 0.4

# Hover and the panel keyboard cursor: transient, so steel.
hover-cursor-color        = "#CCCFD1"
hover-cursor-fill-alpha   = 0.08
hover-cursor-border       = "#CCCFD1"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.25

# Focus: where you are. The accent, outlined.
focus-color        = "#6CB0D0"
focus-fill-alpha   = 0.10
focus-border       = "#6CB0D0"
focus-border-width = 1
focus-border-alpha = 0.45

# Selected: what you chose. The accent, filled rather than outlined, so
# focus and selection are still saying two different things.
selected-color        = "#6CB0D0"
selected-fill-alpha   = 0.16
selected-border       = "#6CB0D0"
selected-border-width = 0
selected-border-alpha = 1.0

# Momentary fills.
pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35
