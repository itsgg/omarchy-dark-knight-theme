<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1012" viewBox="0 0 1800 1012">
  <defs>
    <linearGradient id="goldborder" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="{{accent}}"/><stop offset="100%" stop-color="{{accent_dim}}"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="26" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="{{background}}" stop-opacity="0"/>
      <stop offset="18%" stop-color="{{background}}" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="{{background}}" stop-opacity="0.86"/>
    </linearGradient>
    <style>.m { font-family: "JetBrainsMono Nerd Font","JetBrains Mono",monospace; }</style>
  </defs>

  <!-- Right column gets a soft scrim so the palette stays legible over any
       of the three wallpapers, not just the quiet one. -->
  <rect x="1180" y="0" width="620" height="1012" fill="url(#scrim)"/>

  <g filter="url(#drop)">
    <rect x="104" y="162" width="1040" height="596" fill="url(#goldborder)"/>
    <rect x="106" y="164" width="1036" height="592" fill="{{background}}" fill-opacity="0.97"/>
  </g>

  <text class="m" x="144" y="226" font-size="20" fill="{{dark_foreground}}">gg@dark-knight ~</text>
  <text class="m" x="144" y="294" font-size="22" fill="{{accent}}">$</text>
  <text class="m" x="175" y="294" font-size="22" fill="{{foreground}}">omarchy theme current</text>
  <text class="m" x="144" y="332" font-size="22" fill="{{light_foreground}}">Dark Knight</text>
  <text class="m" x="144" y="400" font-size="22" fill="{{accent}}">$</text>
  <text class="m" x="175" y="400" font-size="22" fill="{{foreground}}">git status</text>
  <text class="m" x="144" y="438" font-size="22" fill="{{green}}">  modified:   _sass/itsgg/_tokens.scss</text>
  <text class="m" x="144" y="474" font-size="22" fill="{{red}}">  deleted:    pages/resume.md</text>
  <text class="m" x="144" y="510" font-size="22" fill="{{blue}}">  branch:     main</text>
  <text class="m" x="144" y="578" font-size="22" fill="{{accent}}">$</text>
  <text class="m" x="175" y="578" font-size="22" fill="{{foreground}}">bundle exec jekyll build</text>
  <text class="m" x="144" y="616" font-size="22" fill="{{yellow}}">  warning:</text>
  <text class="m" x="270" y="616" font-size="22" fill="{{light_foreground}}">3 tag stubs out of date</text>
  <text class="m" x="144" y="652" font-size="22" fill="{{cyan}}">  done in 2.41s</text>
  <text class="m" x="144" y="716" font-size="22" fill="{{accent}}">$</text>
  <rect x="175" y="698" width="12" height="25" fill="{{foreground}}"/>

  <text class="m" x="1318" y="268" font-size="33" fill="{{accent}}" font-weight="700">Dark Knight</text>
  <text class="m" x="1318" y="302" font-size="18" fill="{{light_foreground}}">one hue, carried by light</text>
  <rect x="1318" y="372" width="70" height="70" fill="{{background}}" stroke="{{muted}}" stroke-width="1"/>
  <rect x="1398" y="372" width="70" height="70" fill="{{lighter_background}}" stroke="{{muted}}" stroke-width="1"/>
  <rect x="1478" y="372" width="70" height="70" fill="{{lighter_background}}" stroke="{{muted}}" stroke-width="1"/>
  <rect x="1558" y="372" width="70" height="70" fill="{{line}}" stroke="{{muted}}" stroke-width="1"/>
  <rect x="1318" y="452" width="70" height="70" fill="{{foreground}}" stroke="{{muted}}" stroke-width="1"/>
  <rect x="1398" y="452" width="70" height="70" fill="{{light_foreground}}" stroke="{{muted}}" stroke-width="1"/>
  <rect x="1478" y="452" width="70" height="70" fill="{{dark_foreground}}" stroke="{{muted}}" stroke-width="1"/>
  <rect x="1558" y="452" width="70" height="70" fill="{{muted}}" stroke="{{muted}}" stroke-width="1"/>
  <rect x="1318" y="532" width="70" height="70" fill="{{accent}}" stroke="{{muted}}" stroke-width="1"/>
  <rect x="1398" y="532" width="70" height="70" fill="{{yellow}}" stroke="{{muted}}" stroke-width="1"/>
  <rect x="1478" y="532" width="70" height="70" fill="{{blue}}" stroke="{{muted}}" stroke-width="1"/>
  <rect x="1558" y="532" width="70" height="70" fill="{{bright_blue}}" stroke="{{muted}}" stroke-width="1"/>
  <rect x="1318" y="612" width="70" height="70" fill="{{red}}" stroke="{{muted}}" stroke-width="1"/>
  <rect x="1398" y="612" width="70" height="70" fill="{{orange}}" stroke="{{muted}}" stroke-width="1"/>
  <rect x="1478" y="612" width="70" height="70" fill="{{green}}" stroke="{{muted}}" stroke-width="1"/>
  <rect x="1558" y="612" width="70" height="70" fill="{{cyan}}" stroke="{{muted}}" stroke-width="1"/>
  <rect x="1318" y="692" width="70" height="70" fill="{{magenta}}" stroke="{{muted}}" stroke-width="1"/>
  <rect x="1398" y="692" width="70" height="70" fill="{{brown}}" stroke="{{muted}}" stroke-width="1"/>
  <rect x="1478" y="692" width="70" height="70" fill="{{selection}}" stroke="{{muted}}" stroke-width="1"/>
  <rect x="1558" y="692" width="70" height="70" fill="{{bright_foreground}}" stroke="{{muted}}" stroke-width="1"/>
  <text class="m" x="1318" y="836" font-size="16" fill="{{dark_foreground}}">itsgg.com design system</text>
</svg>