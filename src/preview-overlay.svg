<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1012" viewBox="0 0 1800 1012">
  <defs>
    <linearGradient id="goldborder" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a227"/><stop offset="100%" stop-color="#e0bc46"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="26" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e0f12" stop-opacity="0"/>
      <stop offset="18%" stop-color="#0e0f12" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#0e0f12" stop-opacity="0.86"/>
    </linearGradient>
    <style>.m { font-family: "JetBrainsMono Nerd Font","JetBrains Mono",monospace; }</style>
  </defs>

  <!-- Right column gets a soft scrim so the palette stays legible over any
       of the three wallpapers, not just the quiet one. -->
  <rect x="1180" y="0" width="620" height="1012" fill="url(#scrim)"/>

  <g filter="url(#drop)">
    <rect x="104" y="162" width="1040" height="596" rx="10" fill="url(#goldborder)"/>
    <rect x="106" y="164" width="1036" height="592" rx="9" fill="#0e0f12" fill-opacity="0.97"/>
  </g>

  <text class="m" x="144" y="226" font-size="20" fill="#7e8694">gg@dark-knight ~</text>
